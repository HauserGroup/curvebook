[workspace]
resolver = "3"
members = ["crates/*", "crates/platform", "apps/*", "xtask"]
default-members = ["crates/*", "apps/curvebook", "apps/curvebook-cli", "xtask"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99.1"
repository = "https://github.com/HauserGroup/curvebook"
publish = false

[workspace.dependencies]
# internal workspace crates (L0 -> L6 + testkit)
curvebook-math = { path = "crates/math" }
curvebook-palette = { path = "crates/palette" }
curvebook-platform = { path = "crates/platform" }
curvebook-doc = { path = "crates/doc" }
curvebook-transform = { path = "crates/transform" }
curvebook-stats = { path = "crates/stats" }
curvebook-fit = { path = "crates/fit" }
# Without its default `bundled-fonts`: a crate that wants the fonts asks for them (the apps and
# curvebook-testkit through the engine's `bundled-fonts`), so a library crate never forces them on
# an embedder that supplies its fonts at run time.
curvebook-text = { path = "crates/text", default-features = false }
curvebook-chart = { path = "crates/chart" }
curvebook-render = { path = "crates/render" }
curvebook-format = { path = "crates/format" }
curvebook-svg = { path = "crates/svg" }
curvebook-pdf = { path = "crates/pdf" }
curvebook-tools = { path = "crates/tools" }
curvebook-engine = { path = "crates/engine", default-features = false }
curvebook-ui-egui = { path = "crates/ui-egui" }
curvebook-mcp = { path = "crates/mcp" }
curvebook-testkit = { path = "crates/testkit" }

# serialization, archive compression & property testing (MIT OR Apache-2.0)
crc32fast = "1.5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# native GPU desktop windowing (without default_fonts to keep only permissive licenses) & wasm bridge
eframe = { version = "0.37", default-features = false }
egui = { version = "0.37", default-features = false }
js-sys = "0.3"
rfd = "0.18"
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", default-features = false, features = ["Window"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
# CurveBook never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Non-negotiables). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Rust 1.100+ expanded `needless_range_loop` on nested matrix/grid loops that pass pinned CI 1.99.1.
needless_range_loop = "allow"

# Workspace crates keep line tables, so panics and backtraces name file and line; dependencies
# carry no debug info. Full debug info would make the dev target dir several times larger.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = "symbols"
panic = "abort"
