[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/lumencraft", "apps/lumencraft-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/lumencraft/lumencraft"

[workspace.dependencies]
# internal workspace crates (L0 -> L6 + testkit)
lumencraft-math = { path = "crates/math" }
lumencraft-palette = { path = "crates/palette" }
lumencraft-doc = { path = "crates/doc" }
lumencraft-transform = { path = "crates/transform" }
lumencraft-stats = { path = "crates/stats" }
lumencraft-fit = { path = "crates/fit" }
# Without its default `bundled-fonts`: a crate that wants the fonts asks for them (the apps and
# lumencraft-testkit through the engine's `bundled-fonts`), so a library crate never forces them on
# an embedder that supplies its fonts at run time.
lumencraft-text = { path = "crates/text", default-features = false }
lumencraft-chart = { path = "crates/chart" }
lumencraft-render = { path = "crates/render" }
lumencraft-format = { path = "crates/format" }
lumencraft-svg = { path = "crates/svg" }
lumencraft-pdf = { path = "crates/pdf" }
lumencraft-tools = { path = "crates/tools" }
lumencraft-engine = { path = "crates/engine", default-features = false }
lumencraft-ui-egui = { path = "crates/ui-egui" }
lumencraft-mcp = { path = "crates/mcp" }
lumencraft-testkit = { path = "crates/testkit" }

# serialization, archive compression & property testing (MIT OR Apache-2.0)
crc32fast = "1.5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
# LumenCraft never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Non-negotiables). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# Workspace crates keep line tables, so panics and backtraces name file and line; dependencies
# carry no debug info. Full debug info would make the dev target dir several times larger.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
