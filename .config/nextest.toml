# Minimum cargo-nextest for this repository: GHSA-vc25-qg58-w57c is fixed in 0.9.150 and CI
# installs at least that version, so an older nextest refuses to run (exit 92 REQUIRED_VERSION_NOT_MET).
nextest-version = "0.9.150"

# A timeout is a failing test, never a successful partial run. No automatic retries.
[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "5s" }

[[profile.ci.overrides]]
filter = 'package(=curvebook) & binary(=control_loopback)'
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "0s" }

# The live pasteboard is shared by the OS, even between different test binaries.
# Reserve every test slot for this test; all exact-byte clipboard checks still run.
[[profile.ci.overrides]]
filter = 'binary(=macos_clipboard_live)'
threads-required = "num-test-threads"

# Subprocess timeout/drain unit tests assert tight wall-clock and 200ms idle bounds on child `sh`
# processes; run without concurrent fork/exec storms while keeping all production bounds intact.
[[profile.ci.overrides]]
filter = 'package(=curvebook-platform) & test(/^process::tests::/)'
threads-required = "num-test-threads"

# Desktop CLI/script playback spawns multiple `curvebook` child processes with bounded idle windows.
[[profile.ci.overrides]]
filter = 'package(=curvebook) & binary(=desktop_host_loop)'
threads-required = "num-test-threads"

# 1,000,000-row selection/brushing micro-budget (< 5ms / 25ms wall-clock) and backgrounded `sh`
# pasteboard drain (< 2s wall-clock) live in the `curvebook-ui-egui` unit-test binary rather than
# a `*perf*` binary; reserve slots so parallel scheduler/fork preemption never trips them.
[[profile.ci.overrides]]
filter = 'package(=curvebook-ui-egui) & (test(=grid_view::tests::rv50_one_million_row_range_selection_and_brushing_completes_under_5ms_without_giant_alloc) | test(=os_integration::tests::r1_s11_08_write_os_pasteboard_with_does_not_wait_on_backgrounded_child_stdio))'
threads-required = "num-test-threads"

# Max-project-cell (26M–50M cell) budget guard tests each allocate several gigabytes of `Cell`
# storage (plus undo snapshots). Running them concurrently on a 16 GB CI runner causes heavy swap
# thrashing (40m timeout) or Linux OOM-killer `SIGKILL` / runner shutdown; serialize them.
[[profile.ci.overrides]]
filter = 'package(=curvebook-engine) & (test(=s07_05_doc_constructors_and_create_data_reject_oversized_cell_products_without_oom) | test(=fa_sec11_03_extract_result_tab_enforces_max_project_cells) | test(=fa_sec12_02_project_cell_budget_enforced_across_import_replace_and_generators) | test(=g12_undo_cell_budget_evicts_oldest_and_keeps_oversized_newest))'
threads-required = "num-test-threads"
