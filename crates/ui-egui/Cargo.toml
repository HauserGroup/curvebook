[package]
name = "curvebook-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "CurveBook desktop and web interface shell: project navigator, spreadsheet grid, dialogs and graph canvas"

[lints]
workspace = true

[features]
default = ["bundled-fonts"]
bundled-fonts = ["curvebook-engine/bundled-fonts", "curvebook-text/bundled-fonts"]
test-support = []

[dependencies]
curvebook-chart = { workspace = true }
curvebook-doc = { workspace = true }
curvebook-engine = { workspace = true }
curvebook-fit = { workspace = true }
curvebook-format = { workspace = true }
curvebook-math = { workspace = true }
curvebook-palette = { workspace = true }
curvebook-pdf = { workspace = true }
curvebook-platform = { workspace = true }
curvebook-render = { workspace = true }
curvebook-stats = { workspace = true }
curvebook-svg = { workspace = true }
curvebook-text = { workspace = true }
curvebook-tools = { workspace = true }
curvebook-transform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui = { workspace = true }
fontdb = { workspace = true }
png = { workspace = true }

[dev-dependencies]
curvebook-testkit = { workspace = true }
curvebook-ui-egui = { path = ".", features = ["test-support"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { workspace = true }
