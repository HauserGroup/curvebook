# Flatpak from-source manifest for LumenCraft (Flathub submission).
# Keep runtime, runtime-version, sdk and finish-args identical to org.lumencraft.LumenCraft.bundle.yml.
id: org.lumencraft.LumenCraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lumencraft
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=cups
  - --system-talk-name=org.freedesktop.Avahi
  - --filesystem=~/.cups:ro
  - --share=network
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=xdg-documents
  - --filesystem=~/.fonts:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: lumencraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/lumencraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p lumencraft -p lumencraft-cli
      - install -Dm755 target/release/lumencraft /app/bin/lumencraft
      - install -Dm755 target/release/lumencraft-cli /app/bin/lumencraft-cli
      - install -Dm644 NOTICE /app/share/doc/lumencraft/NOTICE
      - install -Dm644 packaging/linux/org.lumencraft.LumenCraft.desktop /app/share/applications/org.lumencraft.LumenCraft.desktop
      - install -Dm644 packaging/linux/org.lumencraft.LumenCraft.mime.xml /app/share/mime/packages/org.lumencraft.LumenCraft.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/org.lumencraft.LumenCraft.metainfo.xml.in > /app/share/metainfo/org.lumencraft.LumenCraft.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
