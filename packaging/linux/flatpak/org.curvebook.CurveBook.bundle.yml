# Flatpak release-bundle manifest for CurveBook (built via packaging/linux/flatpak-bundle.sh).
# Keep runtime, runtime-version, sdk and finish-args identical to org.curvebook.CurveBook.yml.
id: org.curvebook.CurveBook
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: curvebook
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=cups
  - --system-talk-name=org.freedesktop.Avahi
  - --filesystem=~/.cups:ro
  - --share=network
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=xdg-documents
  - --filesystem=~/.fonts:ro
build-options:
  no-debuginfo: true
modules:
  - name: curvebook
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/curvebook /app/bin/curvebook
      - install -Dm755 bin/curvebook-cli /app/bin/curvebook-cli
      - install -Dm644 share/applications/org.curvebook.CurveBook.desktop /app/share/applications/org.curvebook.CurveBook.desktop
      - install -Dm644 share/mime/packages/org.curvebook.CurveBook.xml /app/share/mime/packages/org.curvebook.CurveBook.xml
      - install -Dm644 share/metainfo/org.curvebook.CurveBook.metainfo.xml /app/share/metainfo/org.curvebook.CurveBook.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/curvebook /app/share/doc/
    sources:
      - type: dir
        path: stage
