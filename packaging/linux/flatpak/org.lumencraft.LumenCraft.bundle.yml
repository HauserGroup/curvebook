# Flatpak release-bundle manifest for LumenCraft (built via packaging/linux/flatpak-bundle.sh).
# Keep runtime, runtime-version, sdk and finish-args identical to org.lumencraft.LumenCraft.yml.
id: org.lumencraft.LumenCraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: lumencraft
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=cups
  - --system-talk-name=org.freedesktop.Avahi
  - --filesystem=~/.cups:ro
  - --share=network
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=xdg-documents
  - --filesystem=~/.fonts:ro
build-options:
  no-debuginfo: true
modules:
  - name: lumencraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/lumencraft /app/bin/lumencraft
      - install -Dm755 bin/lumencraft-cli /app/bin/lumencraft-cli
      - install -Dm644 share/applications/org.lumencraft.LumenCraft.desktop /app/share/applications/org.lumencraft.LumenCraft.desktop
      - install -Dm644 share/mime/packages/org.lumencraft.LumenCraft.xml /app/share/mime/packages/org.lumencraft.LumenCraft.xml
      - install -Dm644 share/metainfo/org.lumencraft.LumenCraft.metainfo.xml /app/share/metainfo/org.lumencraft.LumenCraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/lumencraft /app/share/doc/
    sources:
      - type: dir
        path: stage
