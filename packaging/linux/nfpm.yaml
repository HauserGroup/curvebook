# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh.
name: curvebook
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: science
priority: optional
maintainer: ${CURVEBOOK_MAINTAINER}
vendor: CurveBook Contributors
homepage: https://github.com/HauserGroup/curvebook
license: MIT OR Apache-2.0
description: |-
  Open-source biostatistics, nonlinear regression, and scientific graphing app.
  Structured scientific data tables, parametric and nonparametric tests, curve
  fitting, survival analysis, and publication-grade SVG and PDF figure export.
  Includes curvebook-cli, a headless runner and MCP server.

overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  rpm:
    depends:
      - libc.so.6()(64bit)
      - libm.so.6(GLIBC_2.35)(64bit)
      - libgcc_s.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - (libvulkan.so.1()(64bit) or libEGL.so.1()(64bit))
    recommends:
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/curvebook
    dst: /usr/bin/curvebook
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/curvebook-cli
    dst: /usr/bin/curvebook-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
