[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
docs-site = [
    "dep:pulldown-cmark",
    "dep:curvebook-doc",
    "dep:curvebook-engine",
    "dep:curvebook-fit",
    "dep:curvebook-format",
    "dep:curvebook-mcp",
    "dep:curvebook-palette",
    "dep:curvebook-stats",
    "dep:curvebook-ui-egui",
]

[dependencies]
crc32fast = { workspace = true }
curvebook-doc = { workspace = true, optional = true }
curvebook-engine = { workspace = true, optional = true }
curvebook-fit = { workspace = true, optional = true }
curvebook-format = { workspace = true, optional = true }
curvebook-mcp = { workspace = true, default-features = false, optional = true }
curvebook-palette = { workspace = true, optional = true }
curvebook-platform = { workspace = true }
curvebook-stats = { workspace = true, optional = true }
curvebook-ui-egui = { workspace = true, default-features = false, optional = true }
flate2 = { workspace = true }
png = { workspace = true }
pulldown-cmark = { workspace = true, optional = true }
semver = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "r12_docs_site"
required-features = ["docs-site"]

[[test]]
name = "xtask_suite"
path = "tests/xtask_suite/main.rs"

[lints]
workspace = true
