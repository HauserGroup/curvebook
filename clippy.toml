# Tests may unwrap, expect, panic and index/slice directly: a failing assertion is the point of a
# test. Shipped code may not (workspace lints in Cargo.toml; AGENTS.md › Non-negotiables).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
disallowed-types = [
  { path = "std::sync::Mutex", reason = "use curvebook_platform::sync::Mutex (or single-owner / message passing) so lock re-entry, cycles, and unbounded waits are caught" },
  { path = "std::sync::MutexGuard", reason = "use curvebook_platform::sync::MutexGuard via curvebook_platform::sync::Mutex" },
  { path = "std::sync::RwLock", reason = "use curvebook_platform::sync::RwLock so lock re-entry, cycles, and unbounded waits are caught" },
  { path = "std::sync::RwLockReadGuard", reason = "use curvebook_platform::sync::RwLockReadGuard via curvebook_platform::sync::RwLock" },
  { path = "std::sync::RwLockWriteGuard", reason = "use curvebook_platform::sync::RwLockWriteGuard via curvebook_platform::sync::RwLock" },
]
cognitive-complexity-threshold = 30
