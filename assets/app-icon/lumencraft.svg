<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1b3d"/>
      <stop offset="100%" stop-color="#1d356b"/>
    </linearGradient>
    <linearGradient id="prismFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="52%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#bg)"/>
  <rect x="52" y="52" width="920" height="920" rx="204" fill="none" stroke="#60a5fa" stroke-opacity="0.22" stroke-width="8"/>

  <!-- Subtle scientific coordinate axes -->
  <path d="M 196 220 L 196 812 L 844 812" fill="none" stroke="#93c5fd" stroke-opacity="0.28" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Confidence band around fitted dose-response curve -->
  <path d="M 232 742 C 420 742, 492 286, 812 286 L 812 358 C 532 358, 456 790, 232 790 Z" fill="#38bdf8" fill-opacity="0.16"/>

  <!-- Dispersive prism motif -->
  <polygon points="184,748 336,448 448,748" fill="url(#prismFill)" stroke="#bae6fd" stroke-opacity="0.72" stroke-width="14" stroke-linejoin="round"/>

  <!-- Fitted sigmoidal regression curve -->
  <path d="M 224 764 C 446 764, 504 316, 816 316" fill="none" stroke="url(#curveGrad)" stroke-width="38" stroke-linecap="round"/>

  <!-- Experimental replicate markers -->
  <circle cx="292" cy="748" r="26" fill="#0f1b3d" stroke="#38bdf8" stroke-width="16"/>
  <circle cx="468" cy="616" r="26" fill="#0f1b3d" stroke="#34d399" stroke-width="16"/>
  <circle cx="592" cy="432" r="26" fill="#0f1b3d" stroke="#a7f3d0" stroke-width="16"/>
  <circle cx="756" cy="322" r="26" fill="#0f1b3d" stroke="#fbbf24" stroke-width="16"/>
</svg>
