[package]
name = "lumencraft-web"
description = "LumenCraft in the browser (WebAssembly runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "lumencraft-web"
path = "src/main.rs"

[dependencies]
lumencraft-engine = { workspace = true, features = ["bundled-fonts"] }
lumencraft-ui-egui = { workspace = true }
lumencraft-format = { workspace = true }
lumencraft-text = { workspace = true }
