[package]
name = "curvebook-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "CurveBook command line: MCP server (stdio), headless statistical runs and figure export"

[[bin]]
name = "curvebook-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
curvebook-chart = { workspace = true }
curvebook-doc = { workspace = true }
curvebook-engine = { workspace = true, features = ["bundled-fonts"] }
curvebook-format = { workspace = true }
curvebook-mcp = { workspace = true }
curvebook-pdf = { workspace = true }
curvebook-platform = { workspace = true }
curvebook-render = { workspace = true }
curvebook-svg = { workspace = true }
curvebook-text = { workspace = true }
curvebook-ui-egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
curvebook-testkit = { workspace = true }
