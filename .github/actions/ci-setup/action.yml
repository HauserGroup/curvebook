name: Set up CI tools and cache
description: Restore a shared build cache and install pinned verification tools.
inputs:
  save-cache:
    description: Only the build job writes the shared cache, before tests run.
    default: 'false'
  cache-key:
    description: Rolling cache namespace for this job stream.
    default: 'ci-build'
  restore-mtimes:
    description: Restore unchanged file mtimes from the cached base commit SHA after cache restore.
    default: 'true'
  install-deny:
    description: Ensure cargo-deny is installed (needed by the build cache writer and policy stage).
    default: 'false'
  reclaim-disk:
    description: Reclaim unused preinstalled runner SDK disk space before large archive builds or extractions.
    default: 'false'
  install-gui-libs:
    description: Install Linux desktop/EGL/font build libraries required for native compiles and tests.
    default: 'true'
  install-linters:
    description: Install shellcheck and pinned actionlint required by workflow lint and policy checks.
    default: 'false'
  install-nextest:
    description: Install pinned cargo-nextest runner required by native test and feature stages.
    default: 'false'
  install-libarchive:
    description: Install libarchive-tools (bsdtar) required by release-scan archive tests.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Reclaim unused runner SDK disk space
      if: inputs.reclaim-disk == 'true'
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
        df -h /
    - name: Install system libraries
      if: inputs.install-gui-libs == 'true' || inputs.install-linters == 'true' || inputs.install-libarchive == 'true'
      shell: bash
      env:
        INSTALL_GUI_LIBS: ${{ inputs.install-gui-libs }}
        INSTALL_LINTERS: ${{ inputs.install-linters }}
        INSTALL_LIBARCHIVE: ${{ inputs.install-libarchive }}
      run: |
        set -euo pipefail
        pkgs=()
        if [ "$INSTALL_GUI_LIBS" = "true" ]; then
          pkgs+=(
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
            libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
            libgl1-mesa-dev
          )
        fi
        if [ "$INSTALL_LINTERS" = "true" ]; then
          pkgs+=(shellcheck)
        fi
        if [ "$INSTALL_LIBARCHIVE" = "true" ]; then
          pkgs+=(libarchive-tools)
        fi
        if [ "${#pkgs[@]}" -eq 0 ]; then
          exit 0
        fi
        apt_opts=(
          -o Acquire::Retries=5
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o Dpkg::Use-Pty=0
        )
        for attempt in 1 2 3 4; do
          if sudo DEBIAN_FRONTEND=noninteractive apt-get update -q "${apt_opts[@]}" \
            && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --fix-missing "${apt_opts[@]}" "${pkgs[@]}"; then
            break
          fi
          if [ "$attempt" -eq 4 ]; then
            exit 1
          fi
          sleep $((attempt * 5))
        done
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: '1.99.1'
        components: rustfmt, clippy
    - name: Prepare Cargo cache directories
      shell: bash
      run: mkdir -p ~/.cargo/bin ~/.cargo/registry/index ~/.cargo/registry/cache ~/.cargo/git/db target
    - name: Restore Rust and Cargo build cache
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/cargo-deny*
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: rolling-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          rolling-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
          rolling-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore and save Rust and Cargo build cache
      if: inputs.save-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/cargo-deny*
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: rolling-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          rolling-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
          rolling-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore unchanged file mtimes from cached base SHA
      if: inputs.restore-mtimes == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ -f target/.ci-cache-base-sha ]; then
          if [ -x target/debug/xtask ]; then
            ./target/debug/xtask ci-cache restore-mtimes || cargo run --locked --no-default-features -p xtask -- ci-cache restore-mtimes
          else
            cargo run --locked --no-default-features -p xtask -- ci-cache restore-mtimes
          fi
        fi
    - name: Install pinned verification tools
      shell: bash
      env:
        INSTALL_NEXTEST: ${{ inputs.install-nextest }}
        INSTALL_LINTERS: ${{ inputs.install-linters }}
        INSTALL_DENY: ${{ inputs.install-deny }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/ci-tools"
        if [ "$INSTALL_NEXTEST" = "true" ]; then
          tarball="$RUNNER_TEMP/ci-tools/nextest.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 60 'https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-x86_64-unknown-linux-gnu.tar.gz' -o "$tarball"
          printf '%s  %s\n' 'd039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a' "$tarball" | sha256sum --check
          tar -xzf "$tarball" -C "$RUNNER_TEMP/ci-tools" cargo-nextest
          rm -f "$tarball"
        fi
        if [ "$INSTALL_LINTERS" = "true" ]; then
          tarball="$RUNNER_TEMP/ci-tools/actionlint.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 60 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' -o "$tarball"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$tarball" | sha256sum --check
          tar -xzf "$tarball" -C "$RUNNER_TEMP/ci-tools" actionlint
          rm -f "$tarball"
        fi
        echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"
        if [ "$INSTALL_DENY" = "true" ] && ! cargo deny --version 2>/dev/null | grep -Fx 'cargo-deny 0.20.2'; then
          cargo install --locked cargo-deny --version 0.20.2
        fi
