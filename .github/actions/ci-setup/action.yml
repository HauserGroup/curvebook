name: Set up CI tools and cache
description: Restore a shared build cache and install pinned verification tools.
inputs:
  save-cache:
    description: Only the build job writes the shared cache, before tests run.
    default: 'false'
  cache-key:
    description: Cache prefix namespace for Swatinem/rust-cache.
    default: 'ci-build'
  install-deny:
    description: Ensure cargo-deny is installed (needed by the build cache writer and policy stage).
    default: 'false'
  install-about:
    description: Ensure cargo-about is installed (needed by the build cache writer and tests stage for offline license HTML checks).
    default: 'false'
  reclaim-disk:
    description: Reclaim unused preinstalled runner SDK disk space before large archive builds or extractions.
    default: 'false'
  install-gui-libs:
    description: Install Linux desktop/EGL/font build libraries required for native compiles and tests.
    default: 'true'
  install-linters:
    description: Install shellcheck and pinned actionlint required by workflow lint and policy checks.
    default: 'false'
  install-nextest:
    description: Install pinned cargo-nextest runner required by native test and feature stages.
    default: 'false'
  install-libarchive:
    description: Install libarchive-tools (bsdtar) required by release-scan archive tests.
    default: 'false'
  install-pdf-qa:
    description: Install poppler-utils (pdftoppm), ghostscript (gs), and DejaVu Sans fonts required by PDF external viewer QA tests.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Reclaim unused runner SDK disk space
      if: inputs.reclaim-disk == 'true'
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
        df -h /
    - name: Install system libraries
      if: inputs.install-gui-libs == 'true' || inputs.install-linters == 'true' || inputs.install-libarchive == 'true' || inputs.install-pdf-qa == 'true'
      shell: bash
      env:
        INSTALL_GUI_LIBS: ${{ inputs.install-gui-libs }}
        INSTALL_LINTERS: ${{ inputs.install-linters }}
        INSTALL_LIBARCHIVE: ${{ inputs.install-libarchive }}
        INSTALL_PDF_QA: ${{ inputs.install-pdf-qa }}
      run: |
        set -euo pipefail
        pkgs=()
        if [ "$INSTALL_GUI_LIBS" = "true" ]; then
          pkgs+=(
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
            libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
            libgl1-mesa-dev
          )
        fi
        if [ "$INSTALL_LINTERS" = "true" ]; then
          pkgs+=(shellcheck)
        fi
        if [ "$INSTALL_LIBARCHIVE" = "true" ]; then
          pkgs+=(libarchive-tools)
        fi
        if [ "$INSTALL_PDF_QA" = "true" ]; then
          pkgs+=(poppler-utils ghostscript fonts-dejavu-core)
        fi
        if [ "${#pkgs[@]}" -eq 0 ]; then
          exit 0
        fi
        apt_opts=(
          -o Acquire::Retries=5
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o Dpkg::Use-Pty=0
        )
        for attempt in 1 2 3 4; do
          if sudo DEBIAN_FRONTEND=noninteractive apt-get update -q "${apt_opts[@]}" \
            && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --fix-missing "${apt_opts[@]}" "${pkgs[@]}"; then
            break
          fi
          if [ "$attempt" -eq 4 ]; then
            exit 1
          fi
          sleep $((attempt * 5))
        done
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: '1.99.1'
        components: rustfmt, clippy
    - name: Restore and save Rust and Cargo build cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        prefix-key: v0-rust-${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache == 'true' }}
    - name: Install pinned verification tools
      shell: bash
      env:
        INSTALL_NEXTEST: ${{ inputs.install-nextest }}
        INSTALL_LINTERS: ${{ inputs.install-linters }}
        INSTALL_DENY: ${{ inputs.install-deny }}
        INSTALL_ABOUT: ${{ inputs.install-about }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/ci-tools"
        if [ "$INSTALL_NEXTEST" = "true" ]; then
          tarball="$RUNNER_TEMP/ci-tools/nextest.tar.gz"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 60 'https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-x86_64-unknown-linux-gnu.tar.gz' -o "$tarball"
          printf '%s  %s\n' 'd039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a' "$tarball" | sha256sum --check
          tar -xzf "$tarball" -C "$RUNNER_TEMP/ci-tools" cargo-nextest
          rm -f "$tarball"
        fi
        if [ "$INSTALL_LINTERS" = "true" ]; then
          tarball="$RUNNER_TEMP/ci-tools/actionlint.tar.gz"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 60 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' -o "$tarball"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$tarball" | sha256sum --check
          tar -xzf "$tarball" -C "$RUNNER_TEMP/ci-tools" actionlint
          rm -f "$tarball"
        fi
        echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"
        if [ "$INSTALL_DENY" = "true" ] && ! cargo deny --version 2>/dev/null | grep -Fx 'cargo-deny 0.20.2'; then
          cargo install --locked cargo-deny --version 0.20.2
        fi
        if [ "$INSTALL_ABOUT" = "true" ] && ! cargo about --version 2>/dev/null | grep -Fx 'cargo-about 0.9.3'; then
          cargo install --locked cargo-about --version 0.9.3 --features cli
        fi
