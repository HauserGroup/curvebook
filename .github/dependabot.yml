version: 2
updates:
  # Maintain Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directories:
      - "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      egui-stack:
        patterns: ["egui*", "eframe", "epaint*", "ecolor", "emath", "winit", "wgpu*", "naga", "accesskit*", "vello*", "peniko", "kurbo"]
      font-stack:
        patterns: ["fontdb", "harfrust", "skrifa", "read-fonts", "font-types"]
      image-stack:
        patterns: ["image", "png", "tiff", "weezl", "zune-*"]
      platform-stack:
        patterns: ["zbus*", "zvariant*", "x11rb*"]
      apple-stack:
        patterns: ["objc2*", "block2", "dispatch2"]
      # Everything else: patch bumps only (minor/major of other crates get one PR each).
      cargo-patch:
        update-types: ["patch"]
        patterns: ["*"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
