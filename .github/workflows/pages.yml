# Publish the documentation site (R12.9). Only the files on the publish list in
# xtask/src/pages_site.rs are deployed, so internal Markdown under docs/ (roadmap, audits,
# planning, evidence, reference sources, schemas) is never served on Pages.
# Requires Settings -> Pages -> Source: GitHub Actions (see docs/release/github-pages.md).
name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "xtask/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CI: 'true'
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '5'

jobs:
  build:
    name: Stage the published site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          install-gui-libs: 'false'
      - name: Copy only the published files
        run: cargo run --locked -p xtask --no-default-features -- pages-stage _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
