# Publish the documentation site (R12.9, R12.10, R21.4). Manual HTML (`manual/index.html`,
# `manual/latest/`, and active versioned snapshots) plus generated root metadata (`sitemap.xml`,
# `llms.txt`, `llms-full.txt`) are generated in CI into a build directory before `pages-stage`, and
# only the files on the publish list in `xtask/src/pages_site.rs` are deployed, so neither internal
# Markdown under `docs/` nor generated manual/SEO outputs live on `main`.
# Requires Settings -> Pages -> Source: GitHub Actions (see docs/release/github-pages.md).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "xtask/**"
      - "crates/**"
      - "apps/curvebook-cli/src/cli_catalog.rs"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
      - ".github/actions/ci-setup/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CI: 'true'
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '5'

jobs:
  build:
    name: Build and stage the published site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          install-gui-libs: 'false'
      - name: Build and verify manual HTML
        run: cargo run --locked -p xtask --features docs-site -- docs-site --build-manual target/docs-manual --check
      - name: Stage only the published files
        run: cargo run --locked -p xtask --features docs-site -- pages-stage --manual-dir target/docs-manual _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
