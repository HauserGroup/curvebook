# Standalone FreeBSD build and package check in a QEMU VM.
name: FreeBSD

on:
  push:
    branches: [release]
  pull_request:
    paths:
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
      - packaging/env.sh
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  schedule:
    - cron: "29 4 * * *"
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    name: FreeBSD x86_64 package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and package inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y bash curl git pkgconf rustup-init
          run: |
            set -eu
            rustup-init -y --profile minimal --default-toolchain 1.99.1 --no-modify-path
            . "$HOME/.cargo/env"
            rustc --version
            bash ./packaging/freebsd/package.sh
