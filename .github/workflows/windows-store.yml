# Builds submission files only. Microsoft signs the MSIX after Store certification.
name: Windows Store package

on:
  pull_request:
    paths:
      - .github/workflows/windows-store.yml
      - packaging/windows/AppxManifest.xml.in
      - packaging/windows/store-identity.json
      - xtask/src/msix.rs
      - xtask/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:
    inputs:
      package_version:
        description: "Store version A.B.C.0 (A >= 1); increase for each Store update"
        required: true
        type: string
        default: "1.0.0.0"

permissions:
  contents: read

concurrency:
  group: windows-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: Generate third-party license report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msix-licenses
      - name: Generate license notices
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-about --version 0.9.3 --features cli
          cargo fetch --locked
          cargo deny check licenses
          mkdir -p licenses
          cargo about generate about.hbs -o licenses/THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix-license-notices
          path: licenses/THIRD-PARTY-LICENSES.html
          if-no-files-found: error

  package:
    name: Build x64 MSIX for Store submission
    needs: licenses
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
      CURVEBOOK_REQUIRE_WINRES: "1"
      CURVEBOOK_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.1"
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msix-x64
          cache-on-failure: true
          cache-workspace-crates: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msix-license-notices
          path: licenses
      - name: Test package validation and staging
        run: cargo test --locked -p xtask msix::tests
      - name: Build desktop and CLI with static CRT
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p curvebook -p curvebook-cli
      - name: Check CLI executable
        shell: pwsh
        run: |
          & ./target/x86_64-pc-windows-msvc/release/curvebook-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'CLI smoke check failed' }
      - name: Package and validate with Windows SDK
        env:
          STORE_PACKAGE_VERSION: ${{ inputs.package_version || '1.0.0.0' }}
        shell: pwsh
        run: |
          cargo run --locked -p xtask -- msix --arch x64 --package-version "$env:STORE_PACKAGE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'MSIX packaging failed' }
      - name: Write SHA-256 checksums and build summary
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist/msix -File | Where-Object { $_.Extension -in '.msix', '.xml' } | Sort-Object Name)
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksums | Set-Content dist/msix/SHA256SUMS.txt -Encoding utf8NoBOM
          @(
            '## Windows Store submission package',
            '',
            "Source: $env:GITHUB_SHA",
            '',
            'Download the curvebook-store-x64 artifact below, extract it, then upload the .msix under Packages in Partner Center.',
            '',
            'This package is unsigned. Microsoft signs it after certification. It is not a direct-download installer.',
            '',
            'Package construction and CLI smoke checks do not establish installed CLI/MCP or GUI acceptance. Those checks remain open under R8.9.'
          ) >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curvebook-store-x64
          path: |
            dist/msix/*.msix
            dist/msix/*.xml
            dist/msix/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
