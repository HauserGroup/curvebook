name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    name: Build native test archive
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          save-cache: 'true'
          install-deny: 'true'
          reclaim-disk: 'true'
      - name: Check formatting and workflows before compilation
        run: |
          cargo fmt --all -- --check
          actionlint -config-file .github/actionlint.yaml
      - name: Build all native test targets without executing tests
        run: cargo run --locked -p xtask -- ci build
      - name: Share the exact compiled test binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-tests
          path: target/ci-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Avoid duplicating the uploaded archive in the build cache
        run: rm -- target/ci-tests.tar.zst

  checks:
    name: CI / ${{ matrix.stage }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        stage: [policy, lint, tests, doctests, features, wasm, performance]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          install-deny: ${{ matrix.stage == 'policy' && 'true' || 'false' }}
          reclaim-disk: ${{ (matrix.stage == 'tests' || matrix.stage == 'performance' || matrix.stage == 'features') && 'true' || 'false' }}
      - name: Restore the test binaries built for this revision
        if: matrix.stage == 'tests' || matrix.stage == 'performance'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-tests
          path: target
      - name: Check licences, advisories, yanked crates, bans and sources
        if: matrix.stage == 'policy'
        run: cargo deny check
      - name: Run quality stage
        env:
          CI_STAGE: ${{ matrix.stage }}
          CURVEBOOK_CI_TEST_ARCHIVE: target/ci-tests.tar.zst
        run: |
          cargo build --locked -p xtask
          cp target/debug/xtask "$RUNNER_TEMP/curvebook-ci"
          "$RUNNER_TEMP/curvebook-ci" ci "$CI_STAGE"

  gate:
    # Keep the existing required-check name while requiring every stage to succeed.
    name: Workspace CI gate
    needs: [build, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all quality stages
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$CHECKS_RESULT" = success
