name: CI

# Standalone quality gates for every push to main and every pull request (`cargo xtask ci`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Workspace CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev \
            libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers \
            libgl1-mesa-dev shellcheck
      - name: Lint GitHub Actions workflows (actionlint)
        shell: bash
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/download-actionlint.bash"
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash -o "$script"
          bash "$script" latest "$RUNNER_TEMP/actionlint-bin"
          "$RUNNER_TEMP/actionlint-bin/actionlint" -config-file .github/actionlint.yaml
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install --locked cargo-deny
          fi
      - name: Check license policy (cargo-deny)
        run: cargo deny check licenses
      - name: Run cargo xtask ci
        env:
          CI: "true"
        run: cargo run --locked -p xtask -- ci
