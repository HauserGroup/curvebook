name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '5'

jobs:
  build:
    name: Build native test archive
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          save-cache: 'true'
          install-deny: 'true'
          reclaim-disk: 'true'
          install-gui-libs: 'true'
          install-linters: 'true'
          install-nextest: 'true'
      - name: Check formatting and workflows before compilation
        run: |
          cargo fmt --all -- --check
          actionlint -config-file .github/actionlint.yaml
      - name: Build all native test targets and record active build units
        run: |
          set -euo pipefail
          mkdir -p target
          cargo build --locked -p xtask --message-format=json-render-diagnostics > target/.ci-cache-units.jsonl
          cargo nextest archive --locked --workspace --all-targets --cargo-message-format=json-render-diagnostics --archive-file target/ci-tests.tar.zst >> target/.ci-cache-units.jsonl
      - name: Share the exact compiled test binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-tests
          path: target/ci-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Trim build cache to active units and record base commit SHA
        run: |
          set -euo pipefail
          rm -f -- target/ci-tests.tar.zst
          ./target/debug/xtask ci-cache trim --messages target/.ci-cache-units.jsonl
          rm -f -- target/.ci-cache-units.jsonl

  checks:
    name: CI / ${{ matrix.stage }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        stage: [policy, lint, tests, doctests, features, performance]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          install-gui-libs: 'true'
          install-linters: ${{ matrix.stage == 'policy' && 'true' || 'false' }}
          install-nextest: ${{ (matrix.stage == 'tests' || matrix.stage == 'performance' || matrix.stage == 'features') && 'true' || 'false' }}
          # The release-scan tests unpack a synthetic `.rpm` that only libarchive can read.
          install-libarchive: ${{ matrix.stage == 'tests' && 'true' || 'false' }}
          install-pdf-qa: ${{ matrix.stage == 'tests' && 'true' || 'false' }}
          install-deny: ${{ matrix.stage == 'policy' && 'true' || 'false' }}
          reclaim-disk: ${{ (matrix.stage == 'tests' || matrix.stage == 'performance' || matrix.stage == 'features') && 'true' || 'false' }}
      - name: Restore the test binaries built for this revision
        if: matrix.stage == 'tests' || matrix.stage == 'performance'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-tests
          path: target
      - name: Check licences, advisories, yanked crates, bans and sources
        if: matrix.stage == 'policy'
        run: cargo deny check
      - name: Fetch locked dependencies for offline audit tests
        if: matrix.stage == 'tests'
        run: cargo fetch --locked
      # The corpus is pinned by SHA-256 and byte size in curvebook-testkit, so a restored copy is
      # verified exactly like a fresh download; `--fetch-only` keeps verified files and downloads
      # only missing or stale ones. An older cache is still a useful partial restore.
      - name: Restore the verified NIST StRD corpus
        id: corpus-cache
        if: matrix.stage == 'tests'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus/nist-strd
          key: nist-strd-${{ hashFiles('crates/testkit/src/nist_strd/corpus.rs') }}
          restore-keys: nist-strd-
      - name: Download and verify the full NIST StRD corpus
        if: matrix.stage == 'tests'
        run: cargo run --locked -p xtask -- corpus --fetch-only
      # Saved straight after verification, so a later test failure cannot discard a good corpus.
      - name: Save the verified NIST StRD corpus
        if: matrix.stage == 'tests' && steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus/nist-strd
          key: nist-strd-${{ hashFiles('crates/testkit/src/nist_strd/corpus.rs') }}
      - name: Run quality stage
        env:
          CI_STAGE: ${{ matrix.stage }}
          CURVEBOOK_CI_TEST_ARCHIVE: target/ci-tests.tar.zst
          CURVEBOOK_CORPUS_DIR: ${{ github.workspace }}/corpus/nist-strd
          CURVEBOOK_REQUIRE_CORPUS: ${{ matrix.stage == 'tests' && '1' || '0' }}
        run: |
          cargo build --locked -p xtask
          cp target/debug/xtask "$RUNNER_TEMP/curvebook-ci"
          "$RUNNER_TEMP/curvebook-ci" ci "$CI_STAGE"

  gate:
    # Keep the existing required-check name while requiring every stage to succeed.
    name: Workspace CI gate
    needs: [build, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all quality stages
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$CHECKS_RESULT" = success

  prune-caches:
    name: Prune superseded CI caches
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete superseded rolling CI caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_SUFFIX: -${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for prefix in "rolling-ci-build-" "v0-rust-ci-linux-v2-"; do
            json="$(gh cache list --repo "$REPO" --key "$prefix" --sort created_at --order desc --limit 100 --json id,key,ref,createdAt)"
            ids="$(
              JSON_DATA="$json" PREFIX="$prefix" RUN_SUFFIX="$RUN_SUFFIX" python3 - <<'PY'
          import datetime, json, os

          entries = json.loads(os.environ["JSON_DATA"])
          prefix = os.environ["PREFIX"]
          run_suffix = os.environ["RUN_SUFFIX"]
          now = datetime.datetime.now(datetime.timezone.utc)

          def parse_age_hours(entry):
              raw = entry.get("createdAt", "")
              if not raw:
                  return 9999.0
              dt = datetime.datetime.fromisoformat(raw.replace("Z", "+00:00"))
              return (now - dt).total_seconds() / 3600.0

          if prefix == "v0-rust-ci-linux-v2-":
              for e in entries:
                  if e.get("ref") == "refs/heads/main" or parse_age_hours(e) >= 2.0:
                      print(e["id"])
          else:
              groups = {}
              for e in entries:
                  parts = e.get("key", "").split("-")
                  # Key shape: rolling-ci-build-<os>-<arch>-<lockhash>-<run_id>-<attempt>
                  slot = "-".join(parts[:5]) if len(parts) >= 5 else e.get("key", "")
                  groups.setdefault((e.get("ref", ""), slot), []).append(e)

              for (ref, _slot), group in groups.items():
                  group.sort(key=lambda e: e.get("createdAt", ""), reverse=True)
                  if ref == "refs/heads/main":
                      keep_id = next((e["id"] for e in group if e.get("key", "").endswith(run_suffix)), None)
                      if keep_id is None and group:
                          keep_id = group[0]["id"]
                      for e in group:
                          if e["id"] != keep_id:
                              print(e["id"])
                  elif ref.startswith("refs/pull/"):
                      keep_id = group[0]["id"] if group and parse_age_hours(group[0]) < 24.0 else None
                      for e in group:
                          if e["id"] != keep_id:
                              print(e["id"])
          PY
            )"
            while IFS= read -r cache_id; do
              [ -n "$cache_id" ] || continue
              gh cache delete "$cache_id" --repo "$REPO" || echo "warning: failed to delete cache $cache_id" >&2
            done <<< "$ids"
          done
