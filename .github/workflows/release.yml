# Standalone release pipeline: every push to `release` builds native installers and
# creates or updates a draft GitHub Release. Manual runs default to Alpha prereleases
# with ad-hoc macOS signing and unsigned Windows packages. Non-Alpha, non-schedule macOS runs
# fail closed when signing or notarization credentials are missing (R8.10). SemVer pre-release
# versions (for example tag v0.1.0-rc.1) are always drafted as prereleases (packaging/release-channel.sh).
# See docs/release/releasing.md.
name: Release

on:
  # Nightly dry run on main: builds release packages (except macOS) without publishing.
  schedule:
    - cron: "37 3 * * *"
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to verify (empty: Cargo.toml; must match the workspace version)"
        type: string
        default: ""
      alpha:
        description: "Create an Alpha draft prerelease with ad-hoc macOS signing and unsigned Windows packages"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  git-sources:
    name: Verify Cargo.lock and release version parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.1"
      - name: Validate release version parity
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, tomllib

          semver_re = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$")
          cargo_toml = tomllib.load(open("Cargo.toml", "rb"))
          cargo_ver = cargo_toml["workspace"]["package"]["version"]
          if not semver_re.fullmatch(cargo_ver):
              print(f"error: Cargo.toml workspace version {cargo_ver!r} is not valid SemVer", file=sys.stderr)
              sys.exit(1)

          input_ver = os.environ.get("INPUT_VERSION", "").strip()
          if input_ver:
              if not semver_re.fullmatch(input_ver):
                  print(f"error: inputs.version {input_ver!r} is not valid SemVer", file=sys.stderr)
                  sys.exit(1)
              if input_ver != cargo_ver:
                  print(f"error: inputs.version {input_ver!r} disagrees with Cargo.toml version {cargo_ver!r}", file=sys.stderr)
                  sys.exit(1)

          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          if ref_type == "tag":
              if not ref_name.startswith("v"):
                  print(f"error: release tag {ref_name!r} must start with 'v'", file=sys.stderr)
                  sys.exit(1)
              tag_ver = ref_name[1:]
              if not semver_re.fullmatch(tag_ver):
                  print(f"error: tag version {tag_ver!r} from {ref_name!r} is not valid SemVer", file=sys.stderr)
                  sys.exit(1)
              if tag_ver != cargo_ver:
                  print(f"error: release tag {ref_name!r} ({tag_ver}) disagrees with Cargo.toml version {cargo_ver!r}", file=sys.stderr)
                  sys.exit(1)
          print(f"Verified release version parity: {cargo_ver}")
          PY
          . ./packaging/env.sh
          cargo run --locked -p xtask -- version
      - name: Verify Cargo.lock sources
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo "Cargo.lock is missing"; exit 1; }
          python3 - <<'PY'
          import os, sys, tomllib
          for path in (".cargo/config", ".cargo/config.toml"):
              if not os.path.exists(path):
                  continue
              config = tomllib.load(open(path, "rb"))
              replaced = [name for name, source in config.get("source", {}).items()
                          if isinstance(source, dict) and "replace-with" in source]
              if replaced or "patch" in config or "paths" in config:
                  print(f"{path} replaces, patches or overrides a source")
                  sys.exit(1)
          PY
          cargo metadata --locked --format-version 1 > /dev/null
          python3 - <<'PY'
          import sys, tomllib
          lock = tomllib.load(open("Cargo.lock", "rb"))
          bad = sorted({p["source"] for p in lock.get("package", [])
                        if p.get("source", "").startswith("git+")})
          if bad:
              print("Unapproved git+ dependencies in Cargo.lock:", *bad, sep="\n")
              sys.exit(1)
          PY

  credits:
    name: Refresh contributors.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.1"
      - name: Run cargo xtask contributors
        run: cargo run --locked -p xtask -- contributors
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contributors-json
          path: contributors/contributors.json

  licenses:
    name: Generate third-party licenses and CycloneDX SBOM
    needs: [git-sources]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'schedule' }}
      - name: Install locked cargo-deny, cargo-about, and cargo-cyclonedx
        run: |
          set -euo pipefail
          if ! cargo deny --version 2>/dev/null | grep -Fx 'cargo-deny 0.20.2'; then
            cargo install --locked cargo-deny --version 0.20.2
          fi
          if ! cargo about --version 2>/dev/null | grep -Fx 'cargo-about 0.9.3'; then
            cargo install --locked cargo-about --version 0.9.3 --features cli
          fi
          if ! cargo cyclonedx --version 2>/dev/null | grep -Fx 'cargo-cyclonedx-cyclonedx 0.5.10'; then
            cargo install --locked cargo-cyclonedx --version 0.5.10
          fi
          cargo deny --version
          cargo about --version
          cargo cyclonedx --version
      - name: Verify licenses and generate THIRD-PARTY-LICENSES.html
        env:
          CI: "true"
        run: |
          set -euo pipefail
          mkdir -p licenses
          cargo deny check licenses
          cargo about generate about.hbs -o licenses/THIRD-PARTY-LICENSES.html
          cargo run --locked -p xtask -- licenses
          test -s licenses/THIRD-PARTY-LICENSES.html
      - name: Generate and scan CycloneDX 1.5 SBOM
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . ./packaging/env.sh
          tag_ver=""
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
            tag_ver="${GITHUB_REF_NAME#v}"
          fi
          ver="${INPUT_VERSION:-${tag_ver:-$VERSION}}"
          if [ "$ver" != "$VERSION" ]; then
            echo "error: resolved release version '$ver' disagrees with packaging/env.sh version '$VERSION'" >&2
            exit 1
          fi
          CURVEBOOK_VERSION="$ver" ./packaging/sbom.sh sbom
          test -s "sbom/curvebook-$ver.cdx.json"
          cargo run --locked -p xtask -- release-scan --no-checksums sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: licenses/THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyclonedx-sbom
          path: sbom/curvebook-*.cdx.json
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    needs: [git-sources, credits, licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contributors-json
          path: contributors
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: licenses
      - name: Install Linux build & packaging dependencies
        run: |
          set -euo pipefail
          apt_opts=(
            -o Acquire::Retries=5
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Dpkg::Use-Pty=0
          )
          pkgs=(
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
            libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
            libgl1-mesa-dev desktop-file-utils appstream fuse3 squashfs-tools
          )
          for attempt in 1 2 3 4; do
            if sudo DEBIAN_FRONTEND=noninteractive apt-get update -q "${apt_opts[@]}" \
              && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --fix-missing "${apt_opts[@]}" "${pkgs[@]}"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'schedule' }}
      - name: Run 1M-cell Column Go/No-Go release benchmark
        if: matrix.arch == 'x86_64'
        run: cargo test --release --locked -p curvebook-ui-egui --test r15_2_anova_and_1m_bench r15_2_gonogo_1m_column_matched_benchmark_release -- --ignored --exact --nocapture
      - name: Build Linux AppImage
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "${INPUT_VERSION:-}" ]; then
            export CURVEBOOK_VERSION="$INPUT_VERSION"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
            export CURVEBOOK_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./packaging/linux/package.sh
          ./packaging/linux/apprun-test.sh
      - name: Scan Linux release assets
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: cargo run --locked -p xtask -- release-scan --no-checksums --report "dist/scan-report-linux-$MATRIX_ARCH.json" dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-report-linux-${{ matrix.arch }}
          path: dist/scan-report-linux-*.json
          if-no-files-found: error

  macos:
    name: macOS universal
    if: github.event_name != 'schedule'
    needs: [git-sources, credits, licenses]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contributors-json
          path: contributors
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: licenses
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'schedule' }}
      - name: Build macOS universal binaries
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            export CURVEBOOK_VERSION="$INPUT_VERSION"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
            export CURVEBOOK_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./packaging/macos/package.sh --arch universal --build-only
      - name: Sign, package, and verify macOS universal DMG
        env:
          CURVEBOOK_COMPATIBILITY_FIXTURE_DIR: dist/release-compatibility
          ALPHA_RELEASE: ${{ inputs.alpha }}
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          APPLE_CERTIFICATE: ${{ !inputs.alpha && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ !inputs.alpha && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          KEYCHAIN_PASSWORD: ${{ !inputs.alpha && secrets.KEYCHAIN_PASSWORD || '' }}
          APPLE_ID: ${{ !inputs.alpha && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ !inputs.alpha && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ !inputs.alpha && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            export CURVEBOOK_VERSION="$INPUT_VERSION"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
            export CURVEBOOK_VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ "${ALPHA_RELEASE:-}" = "true" ]; then
            export MACOS_SIGN_IDENTITY="-"
            ./packaging/macos/package.sh --arch universal --skip-build
            ./packaging/macos/verify.sh --arch universal
          else
            if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
              echo "error: APPLE_CERTIFICATE secret is required for non-Alpha macOS release builds" >&2
              exit 1
            fi
            if [[ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]]; then
              echo "error: APPLE_CERTIFICATE_PASSWORD secret is required for non-Alpha macOS release builds" >&2
              exit 1
            fi
            if [[ -z "${KEYCHAIN_PASSWORD:-}" ]]; then
              echo "error: KEYCHAIN_PASSWORD secret is required for non-Alpha macOS release builds" >&2
              exit 1
            fi
            if [[ -z "${APPLE_ID:-}" ]] || [[ -z "${APPLE_PASSWORD:-}" ]] || [[ -z "${APPLE_TEAM_ID:-}" ]]; then
              echo "error: APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID secrets are required for non-Alpha macOS notarization" >&2
              exit 1
            fi
            kc="$RUNNER_TEMP/curvebook-signing.keychain-db"
            cert="$RUNNER_TEMP/cert.p12"
            existing_kcs=()
            cleanup_keychain() {
              rm -f "$cert"
              if [[ -f "$kc" ]]; then
                security lock-keychain "$kc" >/dev/null 2>&1 || true
                if [[ ${#existing_kcs[@]} -gt 0 ]]; then
                  security list-keychains -d user -s "${existing_kcs[@]}" >/dev/null 2>&1 || true
                fi
                security delete-keychain "$kc" >/dev/null 2>&1 || true
                rm -f "$kc"
              fi
            }
            trap cleanup_keychain EXIT
            while IFS= read -r kc_line; do
              kc_line="${kc_line#"${kc_line%%[![:space:]]*}"}"
              kc_line="${kc_line%\"}"
              kc_line="${kc_line#\"}"
              if [[ -n "$kc_line" ]]; then
                existing_kcs+=("$kc_line")
              fi
            done < <(security list-keychains -d user)
            (umask 077 && printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert")
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
            security import "$cert" -P "$APPLE_CERTIFICATE_PASSWORD" -x -t cert -f pkcs12 -k "$kc" -T /usr/bin/codesign
            rm -f "$cert"
            security list-keychains -d user -s "$kc" "${existing_kcs[@]+"${existing_kcs[@]}"}"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$kc"
            identity="$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
            if [[ -z "$identity" ]]; then
              echo "error: no Developer ID Application codesigning identity found in imported certificate" >&2
              exit 1
            fi
            MACOS_KEYCHAIN="$kc" MACOS_SIGN_IDENTITY="$identity" \
              ./packaging/macos/package.sh --arch universal --require-signing --skip-build
            cleanup_keychain
            # verify.sh runs the shipped curvebook-cli, so keep signing credentials out of its environment.
            env -u APPLE_CERTIFICATE -u APPLE_CERTIFICATE_PASSWORD -u KEYCHAIN_PASSWORD \
              -u APPLE_ID -u APPLE_PASSWORD -u APPLE_TEAM_ID \
              ./packaging/macos/verify.sh --arch universal --require-notarized
          fi
      - name: Retain compatibility fixture from the bundled CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-baseline-macos
          path: dist/release-compatibility/
          if-no-files-found: error
      - name: Scan macOS release assets
        run: cargo run --locked -p xtask -- release-scan --no-checksums --report dist/scan-report-macos-universal.json dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-universal
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-report-macos-universal
          path: dist/scan-report-macos-universal.json
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    needs: [git-sources, credits, licenses]
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contributors-json
          path: contributors
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: licenses
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.1"
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'schedule' }}
      - name: Install WiX v5
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'curvebook-wix'
          dotnet tool install --tool-path $tools wix --version 5.0.2
          $tools >> $env:GITHUB_PATH
          & (Join-Path $tools 'wix.exe') extension add -g WixToolset.UI.wixext/5.0.2
          & (Join-Path $tools 'wix.exe') extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build Windows binaries
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          if ($env:INPUT_VERSION) {
            $env:CURVEBOOK_VERSION = $env:INPUT_VERSION
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $env:CURVEBOOK_VERSION = $env:GITHUB_REF_NAME.Substring(1)
          }
          ./packaging/windows/package.ps1 -Arch $env:MATRIX_ARCH -BuildOnly
      - name: Sign and package Windows MSI
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          MATRIX_ARCH: ${{ matrix.arch }}
          WINDOWS_SIGNING_ENABLED: ${{ github.event_name != 'schedule' && !inputs.alpha && vars.WINDOWS_SIGNING_ENABLED || '' }}
          WINDOWS_CERTIFICATE: ${{ github.event_name != 'schedule' && !inputs.alpha && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name != 'schedule' && !inputs.alpha && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ github.event_name != 'schedule' && !inputs.alpha && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ github.event_name != 'schedule' && !inputs.alpha && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ github.event_name != 'schedule' && !inputs.alpha && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ github.event_name != 'schedule' && !inputs.alpha && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ github.event_name != 'schedule' && !inputs.alpha && secrets.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_CERT_PROFILE: ${{ github.event_name != 'schedule' && !inputs.alpha && secrets.AZURE_CERT_PROFILE || '' }}
        run: |
          if ($env:INPUT_VERSION) {
            $env:CURVEBOOK_VERSION = $env:INPUT_VERSION
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $env:CURVEBOOK_VERSION = $env:GITHUB_REF_NAME.Substring(1)
          }
          $requireSigning = ($env:WINDOWS_SIGNING_ENABLED -eq 'true') -or [bool]$env:WINDOWS_CERTIFICATE -or [bool]$env:AZURE_SIGNING_ACCOUNT
          if ($requireSigning) {
            ./packaging/windows/package.ps1 -Arch $env:MATRIX_ARCH -SkipBuild -RequireSigning
          } else {
            ./packaging/windows/package.ps1 -Arch $env:MATRIX_ARCH -SkipBuild
          }
      - name: Scan Windows release assets
        shell: pwsh
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          cargo run --locked -p xtask -- release-scan --no-checksums --report "dist/scan-report-windows-$env:MATRIX_ARCH.json" dist/release
          if ($LASTEXITCODE -ne 0) { throw 'Windows release-scan failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-report-windows-${{ matrix.arch }}
          path: dist/scan-report-windows-*.json
          if-no-files-found: error

  freebsd:
    name: FreeBSD x86_64 (CLI)
    needs: [git-sources, credits, licenses]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contributors-json
          path: contributors
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: licenses
      - name: Build FreeBSD package
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        with:
          usesh: true
          envs: 'INPUT_VERSION GITHUB_REF_TYPE GITHUB_REF_NAME'
          prepare: pkg install -y bash curl git pkgconf rustup-init
          run: |
            set -eu
            rustup-init -y --profile minimal --default-toolchain 1.99.1 --no-modify-path
            . "$HOME/.cargo/env"
            rustc --version
            if [ -n "${INPUT_VERSION:-}" ]; then
              export CURVEBOOK_VERSION="$INPUT_VERSION"
            elif [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
              export CURVEBOOK_VERSION="${GITHUB_REF_NAME#v}"
            fi
            bash ./packaging/freebsd/package.sh
      - name: Install Rust toolchain on host for release-scan
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'schedule' }}
      - name: Scan FreeBSD release assets on Ubuntu host
        run: cargo run --locked -p xtask -- release-scan --no-checksums --report dist/scan-report-freebsd-x86_64.json dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-freebsd-x86_64
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-report-freebsd-x86_64
          path: dist/scan-report-freebsd-x86_64.json
          if-no-files-found: error

  publish:
    name: Draft GitHub Release
    if: github.event_name != 'schedule'
    needs: [linux, macos, windows, freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SquashFS tools for release-scan
        run: |
          set -euo pipefail
          apt_opts=(
            -o Acquire::Retries=5
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Dpkg::Use-Pty=0
          )
          for attempt in 1 2 3 4; do
            if sudo DEBIAN_FRONTEND=noninteractive apt-get update -q "${apt_opts[@]}" \
              && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --fix-missing "${apt_opts[@]}" squashfs-tools; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'schedule' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: dist/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cyclonedx-sbom
          path: dist/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scan-report-*
          path: dist/scan-reports
          merge-multiple: true
      - name: Verify version parity, generate SHA256SUMS.txt, and run release-scan
        id: release_meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          ALPHA_RELEASE: ${{ inputs.alpha }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . ./packaging/env.sh
          tag_ver=""
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
            tag_ver="${GITHUB_REF_NAME#v}"
          fi
          ver="${INPUT_VERSION:-${tag_ver:-$VERSION}}"
          if [ "$ver" != "$VERSION" ]; then
            echo "error: resolved release version '$ver' disagrees with packaging/env.sh version '$VERSION'" >&2
            exit 1
          fi
          (
            cd dist/release
            files=()
            for file in *; do
              [ "$file" = "SHA256SUMS.txt" ] && continue
              test -f "$file" && test -s "$file"
              files+=("$file")
            done
            test "${#files[@]}" -gt 0
            sha256sum -- "${files[@]}" > ../SHA256SUMS.txt.tmp
            mv ../SHA256SUMS.txt.tmp SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          cargo run --locked -p xtask -- release-scan \
            --expect-beta-set "$ver" \
            --cross-os-reports dist/scan-reports \
            --report dist/release-scan-publish.json \
            dist/release
          printf 'tag=v%s\nversion=%s\n' "$ver" "$ver" >> "$GITHUB_OUTPUT"
          # SemVer pre-release versions (-alpha.N, -beta.N, -rc.N) are always GitHub prereleases.
          ./packaging/release-channel.sh "$ver" "${ALPHA_RELEASE:-}" >> "$GITHUB_OUTPUT"
      # Refuse before attesting, so a rerun against a published release never
      # mints Sigstore attestations for rebuilt files that will not be uploaded.
      - name: Refuse to modify an already-published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "error: refusing to overwrite already-published release $tag (isDraft=$is_draft)" >&2
              exit 1
            fi
          fi
      - name: Attest release artifacts, SBOM, and SHA256SUMS.txt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/release/*'
      - name: Attest CycloneDX SBOM for release packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: dist/release/curvebook-${{ steps.release_meta.outputs.version }}.cdx.json
          subject-path: |
            dist/release/*.dmg
            dist/release/*.msi
            dist/release/*.AppImage
            dist/release/*.tar.gz
      # Fail closed: before anything is uploaded, check every file with the same command
      # docs/reference/get-started.md#verifying-downloads gives users, pinned to this workflow and ref.
      # Retries cover the short delay before a new attestation can be looked up.
      - name: Verify attestations the way a downloader would
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow="$GITHUB_REPOSITORY/.github/workflows/release.yml"
          cd dist/release
          for file in *; do
            verified=false
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$workflow" --source-ref "$GITHUB_REF" \
                --deny-self-hosted-runners >/dev/null; then
                verified=true
                break
              fi
              echo "provenance attestation for $file not verified (attempt $attempt of 5)" >&2
              sleep 10
            done
            if [ "$verified" != true ]; then
              echo "error: $file has no provenance attestation from $workflow at $GITHUB_REF" >&2
              exit 1
            fi
            echo "verified provenance: $file"
          done
          shopt -s nullglob
          sbom_subjects=(*.dmg *.msi *.AppImage *.tar.gz)
          test "${#sbom_subjects[@]}" -gt 0
          for file in "${sbom_subjects[@]}"; do
            verified=false
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
                --predicate-type https://cyclonedx.org/bom \
                --signer-workflow "$workflow" --source-ref "$GITHUB_REF" \
                --deny-self-hosted-runners >/dev/null; then
                verified=true
                break
              fi
              echo "SBOM attestation for $file not verified (attempt $attempt of 5)" >&2
              sleep 10
            done
            if [ "$verified" != true ]; then
              echo "error: $file has no CycloneDX SBOM attestation from $workflow at $GITHUB_REF" >&2
              exit 1
            fi
            echo "verified SBOM attestation: $file"
          done
      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release_meta.outputs.title }}
          RELEASE_PRERELEASE: ${{ steps.release_meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          title="$RELEASE_TITLE"
          prerelease="$RELEASE_PRERELEASE"
          case "$prerelease" in
            true | false) ;;
            *)
              echo "error: release channel did not classify $tag (prerelease='$prerelease')" >&2
              exit 1
              ;;
          esac
          release_flags=(--draft)
          if [ "$prerelease" = "true" ]; then
            release_flags+=(--latest=false)
          fi
          release_flags+=("--prerelease=$prerelease" --title "$title")
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "error: refusing to overwrite already-published release $tag (isDraft=$is_draft)" >&2
              exit 1
            fi
            gh release edit "$tag" "${release_flags[@]}"
            gh release upload "$tag" dist/release/* --clobber
            while IFS= read -r existing_asset; do
              [ -n "$existing_asset" ] || continue
              if [ ! -e "dist/release/$existing_asset" ]; then
                echo "Pruning stale draft release asset: $existing_asset"
                gh release delete-asset "$tag" "$existing_asset" --yes
              fi
            done < <(gh release view "$tag" --json assets --jq '.assets[].name')
          else
            gh release create "$tag" dist/release/* "${release_flags[@]}" --target "$GITHUB_SHA" --generate-notes
          fi
          url="$(gh release view "$tag" --json url --jq .url)"
          printf '### Draft release\n\n[%s](%s)\n\nInstallers (macOS DMG, Windows MSI), Linux AppImage, FreeBSD CLI archive, CycloneDX SBOM, licence disclosures, and SHA256SUMS.txt are attached under **Assets**. This draft is not publicly published.\n' "$title" "$url" >> "$GITHUB_STEP_SUMMARY"
